name: Calendrier macro

# Régénère `src/lib/calendar/events.generated.ts` depuis les sources officielles américaines, une
# fois par semaine. Le calendrier n'étant relu qu'à la publication du site, une cadence
# hebdomadaire suffit largement : la Fed annonce ses réunions dix-huit mois à l'avance et le BEA
# publie l'année civile entière.
#
# Le job ne committe **que** si le générateur franchit ses barrières ET si `npm run check` passe
# sur le fichier régénéré : un push effectué avec le `GITHUB_TOKEN` ne déclenche aucun workflow,
# donc rien ne validerait le résultat après coup. La CI est ensuite appelée explicitement, car
# c'est elle qui porte le déploiement sur Pages.
#
# Le BLS n'est pas relu ici — son réseau de diffusion refuse les clients non-navigateurs. Sa table
# est tenue à la main dans `src/lib/calendar/bls-schedule.ts`, et c'est justement une barrière du
# générateur qui réclame sa relecture, via l'issue ouverte ci-dessous, avant qu'elle ne s'épuise.

on:
  schedule:
    - cron: '17 6 * * 1' # tous les lundis à 06 h 17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  regenerate:
    name: Régénérer et publier le calendrier
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Régénérer le calendrier
        id: generate
        continue-on-error: true
        run: node scripts/generate-calendar.ts

      - name: Y a-t-il quelque chose à publier ?
        id: diff
        if: steps.generate.outcome == 'success'
        run: |
          if git diff --quiet -- src/lib/calendar/events.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- src/lib/calendar/events.generated.ts
          fi

      # Le push ne déclenchant aucun workflow, la validation doit avoir lieu AVANT le commit.
      - name: Vérifier le dépôt avec le nouveau calendrier
        id: check
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npm run check

      - name: Committer et publier
        id: push
        if: steps.diff.outputs.changed == 'true' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/calendar/events.generated.ts
          git commit -m "chore(calendar): refresh the US macro calendar"
          git push
          # La CI porte le déploiement sur Pages et n'est pas déclenchée par ce push.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Garder le planning actif
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable calendar.yml --repo "$GITHUB_REPOSITORY" || true

      - name: Ouvrir, commenter ou refermer l’issue du calendrier
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GENERATE: ${{ steps.generate.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        with:
          script: |
            const title = '[calendrier] La régénération du calendrier macro a échoué';
            const label = 'calendrier';
            const generate = process.env.GENERATE;
            const check = process.env.CHECK;
            const failed = generate !== 'success' || (check !== '' && check !== undefined && check !== 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Exécution : ${runUrl}`,
              `- Génération depuis les sources officielles : **${generate}**`,
              `- Vérification du dépôt (\`npm run check\`) : **${check || 'non lancée (rien à publier)'}**`,
              `- Calendrier modifié : **${process.env.CHANGED || 'false'}**`,
              '',
              'Causes les plus probables, dans l’ordre :',
              '',
              '1. **La table du BLS s’épuise.** Elle est tenue à la main parce que `www.bls.gov`',
              '   refuse les clients non-navigateurs. Rouvrez les quatre pages de calendrier dans',
              '   un vrai navigateur et reportez les dates dans `src/lib/calendar/bls-schedule.ts`',
              '   (les URL sont dans ce fichier), puis mettez `BLS_CHECKED_ON` à jour.',
              '2. **La page du FOMC a changé de forme.** Le journal de l’exécution dit combien de',
              '   réunions ont été lues ; la fixture `tests/fixtures/calendar/fomccalendars.html`',
              '   sert de référence pour comparer.',
              '3. **Le BEA a renommé une série.** Le générateur échoue en la nommant.',
              '',
              'Aucun calendrier appauvri n’a été publié : le script refuse d’écrire plutôt que de',
              'laisser croire qu’il ne se passera rien.',
            ].join('\n');
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: '0e8a16', description: 'Calendrier macroéconomique' });
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label, per_page: 5 });
            const existing = open.find((i) => i.title === title);
            if (failed) {
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Toujours en échec.\n\n${body}` });
              } else {
                await github.rest.issues.create({ ...context.repo, title, labels: [label], body });
              }
              core.setFailed('Calendrier non régénéré : voir l’issue.');
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Rétabli.\n\n${body}` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
            }
