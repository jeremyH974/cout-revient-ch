name: Bug ou chiffre douteux
description: Un écran cassé, un PRU ou un total qui vous semble faux.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Décrivez ce que vous attendiez et ce que vous avez vu. **Ne joignez jamais votre
        fichier CSV** ; si un montant est indispensable, remplacez-le par un exemple fictif.
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Page concernée, étapes pour reproduire, résultat attendu.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic de l'application
      description: Réglages → Aide et retours → « Copier le diagnostic » (ni montant ni quantité).
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: Je n'ai joint ni mon fichier ni de montant réel.
          required: true
