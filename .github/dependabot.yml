version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Délai de sécurité : une version n'est proposée qu'après 7 jours (14 pour une majeure),
    # le temps que les paquets compromis soient retirés du registre. Les mises à jour de
    # sécurité ne sont pas retardées.
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # TypeScript 7 est injouable tant que svelte-check ne l'accepte pas : son pair est borné à
      # `^5.0.0 || ^6.0.0` (4.7.6, dernière version au 26/08/2026), et `npm ci` échoue en ERESOLVE
      # avant toute compilation — or svelte-check EST notre `npm run typecheck`. Voir la PR #1.
      # À retirer dès que svelte-check publie un pair `^7.0.0` ; la majeure 6 reste, elle, proposée.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
